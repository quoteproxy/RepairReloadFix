[General]
; 1 = an item that is less than fTolerance below the health cap of its quality counts as fully repaired, so repair
; kits and shops stop offering it again after every load. 0 = the game's own behaviour (nothing patched).
bEnabled=1
; 1 = such an item's health is also put back to the cap the first time the game asks for its cap or its condition
; (repair kits, shops, item lists, the condition display). 0 = the item's health is left as it is; the checks
; still treat it as fully repaired.
bSnapToCap=1
; Largest shortfall (on the game's 0 - 1 item health scale) still treated as fully repaired. A load leaves the
; value one float step below the cap (about 0.0000000075 at 0.1). Keep this small: a larger value would also take
; back real wear that is smaller than it.
fTolerance=0.0000001
; 1 = write each distinct caller of the hooked functions to the log (diagnostics).
bLogCallers=0
